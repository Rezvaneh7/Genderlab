<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>GenderLab Editorial</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    :root {
      --petroleum: #172B36;
      --petroleum-light: #213B49;
      --red: #A34D45;
      --red-dark: #8C403A;
      --cream: #F7F5F0;
      --paper: #FFFFFF;
      --border: #E2DFD7;
      --text: #172B36;
      --muted: #7B858A;
      --draft: #B18443;
      --published: #557364;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--cream);
      color: var(--text);
      font-family: "Vazirmatn", sans-serif;
    }

    button, input {
      font-family: inherit;
    }

    /* SIDEBAR */

    .sidebar {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      width: 245px;
      background: var(--petroleum);
      color: white;
      display: flex;
      flex-direction: column;
    }

    .brand {
      padding: 34px 27px 27px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .brand-title {
      direction: ltr;
      text-align: right;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .13em;
    }

    .brand-sub {
      direction: ltr;
      text-align: right;
      font-size: 9px;
      letter-spacing: .19em;
      color: rgba(255,255,255,.4);
      margin-top: 4px;
    }

    nav {
      padding: 20px 13px;
      flex: 1;
    }

    .nav-title {
      padding: 0 14px 10px;
      color: rgba(255,255,255,.35);
      font-size: 10px;
    }

    .nav-item {
      width: 100%;
      border: 0;
      padding: 12px 14px;
      margin-bottom: 3px;
      border-radius: 5px;
      background: transparent;
      color: rgba(255,255,255,.7);
      text-align: right;
      cursor: pointer;
      font-size: 13px;
    }

    .nav-item:hover {
      background: rgba(255,255,255,.07);
      color: white;
    }

    .nav-item.active {
      background: var(--red);
      color: white;
      font-weight: 600;
    }

    .sidebar-bottom {
      padding: 20px 27px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: rgba(255,255,255,.35);
      font-size: 9px;
      direction: ltr;
    }

    /* MAIN */

    .main {
      margin-right: 245px;
      min-height: 100vh;
    }

    .topbar {
      height: 68px;
      background: rgba(255,255,255,.88);
      border-bottom: 1px solid var(--border);
      padding: 0 45px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-name {
      font-size: 12px;
      font-weight: 600;
    }

    .site-link {
      font-size: 11px;
      text-decoration: none;
      color: var(--muted);
    }

    .site-link:hover {
      color: var(--red);
    }

    .content {
      max-width: 1400px;
      margin: auto;
      padding: 46px 50px 80px;
    }

    /* PAGE HEADER */

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .eyebrow {
      direction: ltr;
      text-align: right;
      color: var(--red);
      font-size: 9px;
      letter-spacing: .2em;
      font-weight: 700;
      margin-bottom: 7px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
    }

    .description {
      color: var(--muted);
      font-size: 12px;
      margin-top: 7px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }

    .btn.primary {
      border-color: var(--red);
      background: var(--red);
      color: white;
    }

    .btn.primary:hover {
      background: var(--red-dark);
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: white;
      border: 1px solid var(--border);
      margin-bottom: 26px;
    }

    .stat {
      padding: 20px 22px;
      border-left: 1px solid var(--border);
    }

    .stat:last-child {
      border-left: 0;
    }

    .stat-number {
      font-size: 22px;
      font-weight: 600;
    }

    .stat-label {
      color: var(--muted);
      font-size: 10px;
      margin-top: 3px;
    }

    /* LIBRARY */

    .library {
      background: white;
      border: 1px solid var(--border);
    }

    .library-top {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .filters {
      display: flex;
      gap: 4px;
    }

    .filter {
      border: 0;
      background: transparent;
      padding: 7px 11px;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      border-radius: 4px;
    }

    .filter.active {
      background: #F0EEE8;
      color: var(--text);
      font-weight: 600;
    }

    .search {
      width: 260px;
      border: 1px solid var(--border);
      background: #FAF9F6;
      border-radius: 4px;
      padding: 8px 11px;
      outline: none;
      direction: rtl;
      font-size: 11px;
    }

    .search:focus {
      border-color: var(--red);
    }

    /* TABLE */

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      padding: 12px 18px;
      text-align: right;
      color: var(--muted);
      font-size: 9px;
      font-weight: 500;
      background: #FAF9F6;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: #FCFBF8;
    }

    .item-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .item-meta {
      color: var(--muted);
      font-size: 9px;
    }

    .type {
      color: var(--muted);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      direction: ltr;
      font-size: 10px;
      font-weight: 600;
    }

    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .status.draft {
      color: var(--draft);
    }

    .status.draft::before {
      background: var(--draft);
    }

    .status.published {
      color: var(--published);
    }

    .status.published::before {
      background: var(--published);
    }

    .edit {
      color: var(--red);
      text-decoration: none;
      font-size: 10px;
    }

    .empty {
      padding: 55px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 800px) {
      .sidebar {
        display: none;
      }

      .main {
        margin-right: 0;
      }

      .content {
        padding: 30px 20px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .page-head {
        align-items: flex-start;
        flex-direction: column;
        gap: 20px;
      }

      .library-top {
        align-items: stretch;
        flex-direction: column;
      }

      .search {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="brand">
      <div class="brand-title">GENDERLAB</div>
      <div class="brand-sub">EDITORIAL CMS</div>
    </div>

    <nav>
      <div class="nav-title">مدیریت محتوا</div>

      <button class="nav-item active">
        همه محتوا
      </button>

      <button class="nav-item">
        مطالب
      </button>

      <button class="nav-item">
        شماره‌های مجله
      </button>

      <button class="nav-item">
        رسانه‌ها
      </button>
    </nav>

    <div class="sidebar-bottom">
      GENDERLAB / EDITORIAL
    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <div class="topbar-name">
        تحریریه جندرلب
      </div>

      <a href="/Genderlab/" target="_blank" class="site-link">
        مشاهده سایت ↗
      </a>

    </header>


    <div class="content">

      <section class="page-head">

        <div>
          <div class="eyebrow">CONTENT LIBRARY</div>

          <h1>محتوا</h1>

          <div class="description">
            مطالب و شماره‌های منتشرشده و پیش‌نویس‌ها
          </div>
        </div>

        <div class="actions">

          <button class="btn">
            + شماره جدید
          </button>

          <button class="btn primary">
            + مطلب جدید
          </button>

        </div>

      </section>


      <section class="stats">

        <div class="stat">
          <div class="stat-number" id="allCount">—</div>
          <div class="stat-label">همه محتوا</div>
        </div>

        <div class="stat">
          <div class="stat-number" id="draftCount">—</div>
          <div class="stat-label">پیش‌نویس</div>
        </div>

        <div class="stat">
          <div class="stat-number" id="publishedCount">—</div>
          <div class="stat-label">منتشرشده</div>
        </div>

        <div class="stat">
          <div class="stat-number" id="issueCount">—</div>
          <div class="stat-label">شماره‌های مجله</div>
        </div>

      </section>


      <section class="library">

        <div class="library-top">

          <div class="filters">
            <button class="filter active">همه</button>
            <button class="filter">پیش‌نویس‌ها</button>
            <button class="filter">منتشرشده</button>
            <button class="filter">مطالب</button>
            <button class="filter">شماره‌ها</button>
          </div>

          <input
            class="search"
            type="search"
            placeholder="جستجو در محتوا..."
          >

        </div>


        <table>

          <thead>
            <tr>
              <th>عنوان</th>
              <th>نوع</th>
              <th>وضعیت</th>
              <th>تاریخ</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="contentList">

            <tr>
              <td colspan="5">
                <div class="empty">
                  در حال حاضر محتوای GitHub به این پنل متصل نشده است.
                </div>
              </td>
            </tr>

          </tbody>

        </table>

      </section>

    </div>

  </main>

</body>
</html>
