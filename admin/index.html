  <style>

    /* =====================================================
       WORDPRESS ADMIN PALETTE ("Default" scheme)
    ====================================================== */

    :root {
      --sidebar-width: 220px;
      --adminbar-height: 46px;

      --wp-menu-bg: #1D2327;
      --wp-menu-hover-bg: #2C3338;
      --wp-menu-text: #F0F0F1;
      --wp-menu-hover-text: #72AEE6;
      --wp-submenu-bg: #2C3338;
      --wp-submenu-text: #C3C4C7;

      --wp-blue: #2271B1;
      --wp-blue-hover: #135E96;
      --wp-blue-light: #F0F6FC;

      --wp-bg: #F0F0F1;
      --wp-paper: #FFFFFF;
      --wp-border: #C3C4C7;
      --wp-border-light: #DCDCDE;

      --wp-text: #1D2327;
      --wp-muted: #646970;

      --wp-red: #D63638;
      --wp-green: #00A32A;
      --wp-yellow: #DBA617;
    }


    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      min-height: 100% !important;
      background: var(--wp-bg) !important;
      color: var(--wp-text);
      font-family: "Vazirmatn", sans-serif !important;
      font-size: 14px;
    }


    body *,
    button,
    input,
    textarea,
    select {
      box-sizing: border-box;
      font-family: "Vazirmatn", sans-serif !important;
    }


    body {
      padding-right: var(--sidebar-width) !important;
    }


    a {
      text-decoration: none;
    }


    /* =====================================================
       SIDEBAR — WordPress "adminmenu"
    ====================================================== */

    #genderlab-admin-sidebar {
      position: fixed;
      z-index: 999999;

      top: 0;
      right: 0;
      bottom: 0;

      width: var(--sidebar-width);

      display: flex;
      flex-direction: column;

      background: var(--wp-menu-bg);
      color: var(--wp-menu-text);
      direction: rtl;
    }


    .gl-admin-brand {
      height: var(--adminbar-height);

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 0 16px;

      background: #101517;
      color: #FFFFFF;
    }


    .gl-admin-brand-mark {
      width: 26px;
      height: 26px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: var(--wp-blue);

      font-size: 14px;
      font-weight: 800;
    }


    .gl-admin-brand-name {
      direction: ltr;

      font-size: 15px;
      font-weight: 700;
      letter-spacing: .02em;
    }


    .gl-admin-nav {
      flex: 1;
      padding: 12px 0;
    }


    .gl-nav-label {
      padding: 14px 16px 6px;

      color: #8C8F94;

      font-size: 11px;
      font-weight: 600;
    }


    .gl-menu-group {
      position: relative;
    }


    .gl-nav-item {
      position: relative;

      min-height: 38px;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 0 14px;

      color: var(--wp-menu-text);

      font-size: 14px;
      font-weight: 500;

      cursor: pointer;
    }


    .gl-nav-item:hover,
    .gl-menu-group:hover > .gl-nav-item {
      background: var(--wp-menu-hover-bg);
      color: var(--wp-menu-hover-text);
    }


    .gl-nav-item.active,
    .gl-menu-group.current > .gl-nav-item {
      background: var(--wp-blue);
      color: #FFFFFF;
      font-weight: 600;
    }


    /* WordPress's little arrow pointing at the content */
    .gl-menu-group.current > .gl-nav-item::after,
    .gl-nav-section > .gl-nav-item.active::after {
      content: "";

      position: absolute;
      left: 0;
      top: 50%;

      margin-top: -8px;

      border: 8px solid transparent;
      border-left-color: var(--wp-bg);
    }


    .gl-icon {
      width: 20px;
      height: 20px;

      flex: 0 0 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: currentColor;
      opacity: .7;
    }


    .gl-nav-item.active .gl-icon,
    .gl-menu-group.current > .gl-nav-item .gl-icon,
    .gl-nav-item:hover .gl-icon {
      opacity: 1;
    }


    .gl-icon svg {
      width: 19px;
      height: 19px;

      fill: none;

      stroke: currentColor;
      stroke-width: 1.8;

      stroke-linecap: round;
      stroke-linejoin: round;
    }


    .gl-badge {
      margin-right: auto;

      min-width: 18px;
      height: 18px;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 0 5px;

      border-radius: 9px;

      background: var(--wp-red);
      color: #FFFFFF;

      font-size: 10px;
      font-weight: 700;
    }


    .gl-badge.visible {
      display: inline-flex;
    }


    /* Submenu: open under the current item */

    .gl-submenu {
      display: none;

      padding: 7px 0 8px;

      background: var(--wp-submenu-bg);
    }


    .gl-menu-group.current .gl-submenu {
      display: block;
    }


    .gl-submenu a {
      display: block;

      padding: 6px 44px 6px 12px;

      color: var(--wp-submenu-text);

      font-size: 13px;
    }


    .gl-submenu a:hover {
      color: var(--wp-menu-hover-text);
    }


    .gl-submenu a.current {
      color: #FFFFFF;
      font-weight: 600;
    }


    /* Submenu: fly out on hover for the other items */

    .gl-menu-group:not(.current):hover .gl-submenu {
      display: block;

      position: absolute;
      top: 0;
      right: 100%;

      min-width: 170px;

      padding: 7px 0;

      box-shadow: -3px 3px 8px rgba(0,0,0,.2);
    }


    .gl-menu-group:not(.current):hover .gl-submenu a {
      padding: 6px 14px;
    }


    .gl-nav-divider {
      height: 1px;
      margin: 10px 0;
      background: rgba(255,255,255,.08);
    }


    .gl-admin-bottom {
      padding: 8px 0 12px;
      border-top: 1px solid rgba(255,255,255,.08);
    }


    .gl-admin-bottom .gl-nav-item {
      min-height: 34px;
      font-size: 13px;
      color: var(--wp-submenu-text);
    }


    /* =====================================================
       HIDE ORIGINAL DECAP SIDEBAR
    ====================================================== */

    aside.css-1ff92bv-SidebarContainer-card-card {
      display: none !important;
    }


    #nc-root aside[class*="SidebarContainer"] {
      display: none !important;
    }


    /* =====================================================
       DECAP TOP BAR → WORDPRESS ADMIN BAR
    ====================================================== */

    #nc-root header {
      min-height: var(--adminbar-height) !important;
      background: var(--wp-menu-bg) !important;
      box-shadow: none !important;
      border: 0 !important;
    }


    #nc-root header a,
    #nc-root header button,
    #nc-root header span {
      color: var(--wp-menu-text) !important;
    }


    #nc-root header a:hover,
    #nc-root header button:hover {
      color: var(--wp-menu-hover-text) !important;
      background: var(--wp-menu-hover-bg) !important;
    }


    #nc-root header svg {
      fill: currentColor !important;
    }


    /* =====================================================
       CONTENT AREA
    ====================================================== */

    #nc-root {
      min-height: 100vh !important;
      background: var(--wp-bg) !important;
    }


    #nc-root > div {
      background: var(--wp-bg) !important;
    }


    main {
      width: 100% !important;
      background: var(--wp-bg) !important;
    }


    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      color: var(--wp-text) !important;
      font-family: "Vazirmatn", sans-serif !important;
      letter-spacing: 0 !important;
    }


    h1 {
      font-size: 23px !important;
      font-weight: 500 !important;
    }


    /* Cards → WordPress "postbox" */

    [class*="card"],
    [class*="Card"] {
      border: 1px solid var(--wp-border) !important;
      border-radius: 0 !important;
      box-shadow: 0 1px 1px rgba(0,0,0,.04) !important;
    }


    /* Entries → WordPress list-table rows */

    [class*="EntryCard"] {
      margin: 0 !important;

      background: var(--wp-paper) !important;

      border: 0 !important;
      border-bottom: 1px solid var(--wp-border-light) !important;
      border-radius: 0 !important;

      box-shadow: none !important;
    }


    [class*="EntryCard"]:nth-child(odd) {
      background: #F6F7F7 !important;
    }


    [class*="EntryCard"]:hover {
      background: var(--wp-blue-light) !important;
    }


    [class*="EntryCard"] h2 {
      color: var(--wp-blue) !important;
      font-size: 14px !important;
      font-weight: 600 !important;
    }


    /* Buttons → WordPress buttons */

    button,
    a[class*="Button"] {
      border-radius: 3px !important;
      font-family: "Vazirmatn", sans-serif !important;
      box-shadow: none !important;
    }


    #nc-root main button[class*="Primary"],
    #nc-root main button[class*="publish"],
    #nc-root main button[class*="Publish"],
    #nc-root main a[class*="CollectionTopNewButton"],
    #nc-root main a[class*="NewButton"] {
      background: var(--wp-blue) !important;
      border: 1px solid var(--wp-blue) !important;
      color: #FFFFFF !important;
    }


    #nc-root main button[class*="Primary"]:hover,
    #nc-root main button[class*="publish"]:hover,
    #nc-root main button[class*="Publish"]:hover,
    #nc-root main a[class*="CollectionTopNewButton"]:hover,
    #nc-root main a[class*="NewButton"]:hover {
      background: var(--wp-blue-hover) !important;
      border-color: var(--wp-blue-hover) !important;
    }


    /* Fields */

    input,
    textarea,
    select {
      border-radius: 4px !important;
      border-color: #8C8F94 !important;
    }


    textarea {
      direction: rtl !important;
      text-align: right !important;
      line-height: 2 !important;
    }


    input:focus,
    textarea:focus,
    select:focus {
      outline: none !important;
      border-color: var(--wp-blue) !important;
      box-shadow: 0 0 0 1px var(--wp-blue) !important;
    }


    [role="dialog"],
    [role="menu"] {
      border-radius: 0 !important;
      font-family: "Vazirmatn", sans-serif !important;
    }


    [role="menu"] {
      border: 1px solid var(--wp-border) !important;
      box-shadow: 0 3px 6px rgba(0,0,0,.12) !important;
    }


    /* =====================================================
       "پرونده ویژه" NOTICE — WordPress admin notice
    ====================================================== */

    #gl-featured-notice {
      display: none;

      margin: 0 0 18px;
      padding: 10px 14px;

      background: var(--wp-paper);

      border: 1px solid var(--wp-border-light);
      border-right: 4px solid var(--wp-yellow);

      box-shadow: 0 1px 1px rgba(0,0,0,.04);

      font-size: 13px;
      line-height: 1.9;
    }


    #gl-featured-notice.visible {
      display: block;
    }


    #gl-featured-notice strong {
      font-weight: 700;
    }


    /* =====================================================
       PREVIEW BUTTON
    ====================================================== */

    #gl-site-preview-button {
      position: fixed;

      z-index: 999998;

      bottom: 22px;
      left: 22px;

      display: none;
      align-items: center;
      justify-content: center;

      min-height: 36px;

      padding: 0 16px;

      border: 1px solid var(--wp-blue);
      border-radius: 3px;

      background: #F6F7F7;

      color: var(--wp-blue);

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
    }


    #gl-site-preview-button:hover {
      background: var(--wp-blue-light);
      border-color: var(--wp-blue-hover);
      color: var(--wp-blue-hover);
    }


    #gl-site-preview-button.visible {
      display: inline-flex;
    }


    /* =====================================================
       SCROLLBAR
    ====================================================== */

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }


    ::-webkit-scrollbar-track {
      background: #E0E0E0;
    }


    ::-webkit-scrollbar-thumb {
      background: #A7AAAD;
      border-radius: 10px;
    }


    ::-webkit-scrollbar-thumb:hover {
      background: var(--wp-blue);
    }


    /* =====================================================
       FULL-WIDTH COLLECTION PAGES
    ====================================================== */

    #nc-root,
    #nc-root > div,
    #nc-root main {
      width: 100% !important;
      max-width: none !important;
    }

    #nc-root main > div,
    #nc-root main > div > div {
      width: 100% !important;
      max-width: none !important;
    }

    #nc-root [class*="AppMainContainer"],
    #nc-root [class*="MainContainer"],
    #nc-root [class*="CollectionContainer"],
    #nc-root [class*="EntriesCollection"],
    #nc-root [class*="CollectionMain"],
    #nc-root [class*="CollectionTop"] {
      width: 100% !important;
      max-width: none !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
    }

    #nc-root main {
      padding: 22px 26px 60px !important;
    }

    #nc-root [class*="Entries"] {
      width: 100% !important;
      max-width: none !important;
    }

    #nc-root [class*="EntryCard"] {
      width: 100% !important;
      max-width: none !important;
    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 800px) {

      :root {
        --sidebar-width: 0px;
      }


      body {
        padding-right: 0 !important;
      }


      #genderlab-admin-sidebar {
        position: relative;

        width: 100%;
        height: auto;

        bottom: auto;
      }


      .gl-admin-nav {
        display: flex;
        padding: 0;
        overflow-x: auto;
      }


      .gl-nav-section,
      .gl-menu-group {
        display: flex;
        margin: 0;
      }


      .gl-nav-label,
      .gl-submenu,
      .gl-nav-divider,
      .gl-admin-bottom,
      .gl-menu-group.current > .gl-nav-item::after,
      .gl-nav-section > .gl-nav-item.active::after {
        display: none !important;
      }


      .gl-nav-item {
        min-width: max-content;
        padding: 0 16px;
      }


      #gl-site-preview-button {
        right: 15px;
        left: 15px;
        bottom: 15px;
      }

    }

  </style>

</head>

  <!-- =====================================================
       GENDERLAB ADMIN LOGIC
  ====================================================== -->

  <script>

    const GL_PREVIEW_STORAGE_KEY =
      "genderlab_live_preview";


    /* =====================================================
       ROUTE INFORMATION
    ====================================================== */

    function getGenderLabRoute() {

      const hash =
        window.location.hash || "#/";

      let type = null;

      if (hash.includes("/collections/articles")) {
        type = "article";
      }

      if (hash.includes("/collections/interviews")) {
        type = "interview";
      }

      if (hash.includes("/collections/issues")) {
        type = "issue";
      }

      if (hash.includes("/collections/settings")) {
        type = "settings";
      }


      const editing =
        (type === "article" || type === "interview" || type === "issue") &&
        (
          hash.includes("/entries/") ||
          hash.includes("/new")
        );


      return {
        hash,
        type,
        editing
      };

    }



    /* =====================================================
       READ CURRENT DECAP FORM
    ====================================================== */

    function findFieldByLabel(labelText) {

      const labels =
        Array.from(
          document.querySelectorAll("label")
        );


      const label =
        labels.find(item =>
          item.textContent
            .trim()
            .includes(labelText)
        );


      if (!label) {
        return null;
      }


      const container =
        label.closest(
          '[class*="Control"], [class*="Field"], [class*="Widget"]'
        ) ||
        label.parentElement;


      if (!container) {
        return null;
      }


      return (
        container.querySelector(
          'input:not([type="hidden"]), textarea, select'
        ) ||
        null
      );

    }



    function getFieldValue(label) {

      const field =
        findFieldByLabel(label);

      if (!field) {
        return "";
      }


      if (field.type === "checkbox") {
        return field.checked;
      }


      return field.value || "";

    }



    /* =====================================================
       BODY CONTENT
    ====================================================== */

    function getEditorBody() {

      const bodyField =
        findFieldByLabel("متن مطلب") ||
        findFieldByLabel("درباره این شماره");


      if (bodyField) {
        return bodyField.value || "";
      }


      const contentEditable =
        document.querySelector(
          '[contenteditable="true"]'
        );


      if (contentEditable) {
        return contentEditable.innerHTML;
      }


      return "";

    }



    /* =====================================================
       IMAGE
    ====================================================== */

    function getCurrentImage() {

      const candidates =
        Array.from(
          document.querySelectorAll("img")
        );


      const image =
        candidates.find(img => {

          const src =
            img.getAttribute("src") || "";

          return (
            src.includes("/assets/uploads/") ||
            src.includes("blob:") ||
            src.startsWith("data:")
          );

        });


      return image
        ? image.src
        : "";

    }



    /* =====================================================
       COLLECT PREVIEW DATA
    ====================================================== */

    function collectGenderLabPreviewData() {

      const route =
        getGenderLabRoute();


      if (!route.editing) {
        return null;
      }


      if (route.type === "article" || route.type === "interview") {

        return {

          /* preview.html renders interviews with the article template */
          type: "article",

          kind: route.type,

          interviewee:
            getFieldValue("گفت‌وگو با"),

          title:
            getFieldValue("عنوان مطلب"),

          excerpt:
            getFieldValue("خلاصه"),

          author:
            getFieldValue("نویسنده"),

          issue:
            getFieldValue("شماره مجله"),

          category:
            getFieldValue("نوع مطلب"),

          date:
            getFieldValue("تاریخ انتشار"),

          featured:
            getFieldValue("نمایش در پرونده ویژه"),

          body:
            getEditorBody(),

          image:
            getCurrentImage()

        };

      }


      return {

        type: "issue",

        title:
          getFieldValue("عنوان شماره"),

        number:
          getFieldValue("شماره مجله"),

        numberFa:
          getFieldValue("شماره فارسی"),

        season:
          getFieldValue("فصل / تاریخ فارسی"),

        seasonEn:
          getFieldValue("فصل / تاریخ انگلیسی"),

        description:
          getFieldValue("معرفی کوتاه"),

        body:
          getEditorBody(),

        cover:
          getCurrentImage()

      };

    }



    /* =====================================================
       OPEN FULL PAGE PREVIEW
    ====================================================== */

    function openGenderLabPreview() {

      const data =
        collectGenderLabPreviewData();


      if (!data) {

        alert(
          "برای پیش‌نمایش ابتدا یک نوشته یا شماره مجله را باز کنید."
        );

        return;
      }


      try {

        localStorage.setItem(
          GL_PREVIEW_STORAGE_KEY,
          JSON.stringify(data)
        );


        window.open(
          "preview.html",
          "_blank"
        );

      }

      catch (error) {

        console.error(error);

        alert(
          "امکان ساخت پیش‌نمایش وجود نداشت."
        );

      }

    }



    /* =====================================================
       PREVIEW BUTTON VISIBILITY
    ====================================================== */

    function updatePreviewButton() {

      const button =
        document.getElementById(
          "gl-site-preview-button"
        );


      if (!button) {
        return;
      }


      button.classList.toggle(
        "visible",
        getGenderLabRoute().editing
      );

    }



    /* =====================================================
       SIDEBAR — highlight current menu + submenu item
    ====================================================== */

    function setCurrentGroup(groupName, subName) {

      const group =
        document.querySelector(
          '[data-group="' + groupName + '"]'
        );

      if (group) {
        group.classList.add("current");
      }


      if (subName) {

        const sub =
          document.querySelector(
            '[data-sub="' + subName + '"]'
          );

        if (sub) {
          sub.classList.add("current");
        }

      }

    }



    function updateGenderLabSidebar() {

      const hash =
        window.location.hash || "#/";


      document
        .querySelectorAll("#genderlab-admin-sidebar [data-route]")
        .forEach(item => item.classList.remove("active"));

      document
        .querySelectorAll("#genderlab-admin-sidebar .gl-menu-group")
        .forEach(group => group.classList.remove("current"));

      document
        .querySelectorAll("#genderlab-admin-sidebar [data-sub]")
        .forEach(sub => sub.classList.remove("current"));


      if (hash.includes("/workflow")) {
        document.querySelector('[data-route="workflow"]').classList.add("active");
        return;
      }


      if (hash.includes("/media")) {
        document.querySelector('[data-route="media"]').classList.add("active");
        return;
      }


      if (hash.includes("/collections/settings")) {
        setCurrentGroup("featured", "featured-settings");
        return;
      }


      if (hash.includes("/collections/articles")) {

        setCurrentGroup(
          "articles",
          hash.includes("/new") ? "articles-new" : "articles-all"
        );

        return;
      }


      if (hash.includes("/collections/interviews")) {

        setCurrentGroup(
          "interviews",
          hash.includes("/new") ? "interviews-new" : "interviews-all"
        );

        return;
      }


      if (hash.includes("/collections/issues")) {

        setCurrentGroup(
          "issues",
          hash.includes("/new") ? "issues-new" : "issues-all"
        );

        return;
      }


      document
        .querySelector('[data-route="dashboard"]')
        .classList.add("active");

    }



    /* =====================================================
       "پرونده ویژه" HELP NOTICE
       Shown on the dossier settings page, WordPress-notice style.
    ====================================================== */

    function updateFeaturedNotice() {

      const route =
        getGenderLabRoute();

      let notice =
        document.getElementById("gl-featured-notice");


      if (route.type !== "settings") {

        if (notice) {
          notice.classList.remove("visible");
        }

        return;
      }


      const main =
        document.querySelector("#nc-root main");

      if (!main) {
        return;
      }


      if (!notice) {

        notice = document.createElement("div");
        notice.id = "gl-featured-notice";

        notice.innerHTML =
          "<strong>مطالب پرونده چطور انتخاب می‌شوند؟</strong> " +
          "هر نوشته‌ای را که می‌خواهید در پرونده باشد باز کنید، " +
          "گزینهٔ «نمایش در پرونده ویژه» را روشن کنید و در صورت نیاز " +
          "«ترتیب در پرونده» را عدد بدهید (۱ = اول). " +
          "اولین مطلب پرونده بزرگ بالای صفحهٔ اصلی می‌آید و بقیه زیر آن.";

      }


      if (!main.contains(notice)) {
        main.prepend(notice);
      }

      notice.classList.add("visible");

    }



    /* =====================================================
       PREVIEW BUTTON
    ====================================================== */

    document
      .getElementById("gl-site-preview-button")
      .addEventListener("click", openGenderLabPreview);



    /* =====================================================
       ROUTE CHANGE
    ====================================================== */

    function updateGenderLabAdmin() {

      updateGenderLabSidebar();

      /*
       * Decap renders asynchronously,
       * so give the editor a moment to appear.
       */

      [350, 900, 1600].forEach(delay => {

        setTimeout(() => {
          updatePreviewButton();
          updateFeaturedNotice();
        }, delay);

      });

    }


    /* =====================================================
       LIVE PREVIEW SYNC
       While the editor is open, push the draft to the
       preview tab every second — only when it changed.
    ====================================================== */

    let glLastPreviewJSON = "";

    setInterval(function () {

      if (!getGenderLabRoute().editing) {
        return;
      }

      const data = collectGenderLabPreviewData();

      if (!data) {
        return;
      }

      const json = JSON.stringify(data);

      if (json === glLastPreviewJSON) {
        return;
      }

      glLastPreviewJSON = json;

      try {
        localStorage.setItem(GL_PREVIEW_STORAGE_KEY, json);
      } catch (error) {
        /* storage full or blocked — preview simply won't update */
      }

    }, 1000);


    window.addEventListener("hashchange", updateGenderLabAdmin);

    window.addEventListener("load", updateGenderLabAdmin);

    updateGenderLabAdmin();

  </script>


</body>
