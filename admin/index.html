<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">

  <title>GenderLab | Editorial CMS</title>

  <!-- Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- IMPORTANT: keep Decap config -->
  <link href="config.yml" type="text/yaml" rel="cms-config-url">

  <style>

    /* =====================================================
       GENDERLAB CMS
       ===================================================== */

    :root {
      --gl-petroleum: #172B36;
      --gl-petroleum-light: #223D4B;
      --gl-red: #A34D45;
      --gl-red-dark: #8C403A;

      --gl-cream: #F8F7F3;
      --gl-paper: #FFFFFF;
      --gl-soft: #EEECE5;

      --gl-border: #DDDAD2;
      --gl-text: #172B36;
      --gl-muted: #758087;
    }


    /* =====================================================
       GLOBAL
       ===================================================== */

    html,
    body {
      margin: 0 !important;
      min-height: 100% !important;

      background: var(--gl-cream) !important;

      font-family: "Vazirmatn", sans-serif !important;
    }


    body *,
    button,
    input,
    textarea,
    select {
      font-family: "Vazirmatn", sans-serif !important;
    }


    body {
      color: var(--gl-text);
    }


    /* thin GenderLab line */

    body::before {
      content: "";
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      height: 5px;

      background: var(--gl-red);

      z-index: 999999;
    }


    /* =====================================================
       DECAP COLLECTION SIDEBAR
       REAL SELECTOR FROM CURRENT CMS
       ===================================================== */

    aside.css-1ff92bv-SidebarContainer-card-card {

      background: var(--gl-petroleum) !important;

      border: none !important;
      border-radius: 8px !important;

      box-shadow:
        0 8px 24px rgba(23, 43, 54, 0.12) !important;

      overflow: hidden !important;

      padding: 0 !important;

      min-width: 260px !important;
    }


    /* =====================================================
       SIDEBAR TITLE
       ===================================================== */

    .css-148ci7f-SidebarHeading-cardTopHeading {

      background: var(--gl-petroleum) !important;

      color: #FFFFFF !important;

      font-size: 12px !important;
      font-weight: 600 !important;

      letter-spacing: .04em !important;

      padding: 24px 22px 13px !important;

      margin: 0 !important;

      border: none !important;
    }


    /* Add editorial label */

    .css-148ci7f-SidebarHeading-cardTopHeading::before {

      content: "GENDERLAB";

      display: block;

      color: #FFFFFF;

      font-family: "Vazirmatn", sans-serif;

      font-size: 18px;
      font-weight: 700;

      letter-spacing: .12em;

      margin-bottom: 4px;
    }


    .css-148ci7f-SidebarHeading-cardTopHeading::after {

      content: "EDITORIAL CMS";

      display: block;

      color: rgba(255,255,255,.48);

      font-size: 9px;
      font-weight: 500;

      letter-spacing: .18em;

      direction: ltr;
      text-align: right;

      margin-top: 2px;
      margin-bottom: 14px;
    }


    /* =====================================================
       SEARCH
       ===================================================== */

    .css-lk98m2-SearchContainer {

      background: var(--gl-petroleum) !important;

      padding: 5px 16px 17px !important;

      border: none !important;
    }


    .css-1mpi08-InputContainer {

      background: rgba(255,255,255,.08) !important;

      border: 1px solid rgba(255,255,255,.14) !important;

      border-radius: 6px !important;

      box-shadow: none !important;
    }


    .css-1fhcqx0-SearchInput {

      background: transparent !important;

      color: #FFFFFF !important;

      border: none !important;

      direction: rtl !important;
      text-align: right !important;

      font-size: 12px !important;
    }


    .css-1fhcqx0-SearchInput::placeholder {
      color: rgba(255,255,255,.48) !important;
    }


    .css-1mpi08-InputContainer svg {
      fill: rgba(255,255,255,.6) !important;
    }


    /* =====================================================
       COLLECTION NAVIGATION
       ===================================================== */

    .css-kxvohc-SidebarNavList {

      background: var(--gl-petroleum) !important;

      margin: 0 !important;

      padding: 8px 10px 18px !important;

      list-style: none !important;
    }


    .css-kxvohc-SidebarNavList li {

      margin: 3px 0 !important;
      padding: 0 !important;
    }


    /* Collection links */

    a[data-testid="issues"],
    a[data-testid="articles"] {

      display: flex !important;

      align-items: center !important;

      gap: 10px !important;

      padding: 11px 12px !important;

      border-radius: 5px !important;

      color: rgba(255,255,255,.78) !important;

      background: transparent !important;

      font-size: 13px !important;
      font-weight: 500 !important;

      text-decoration: none !important;

      transition:
        background .15s ease,
        color .15s ease !important;
    }


    a[data-testid="issues"]:hover,
    a[data-testid="articles"]:hover {

      background: rgba(255,255,255,.08) !important;

      color: #FFFFFF !important;
    }


    /* active collection */

    a[data-testid="issues"].sidebar-active,
    a[data-testid="articles"].sidebar-active,
    a[data-testid="issues"][aria-current="page"],
    a[data-testid="articles"][aria-current="page"] {

      background: var(--gl-red) !important;

      color: #FFFFFF !important;

      font-weight: 600 !important;
    }


    /* icons */

    a[data-testid="issues"] svg,
    a[data-testid="articles"] svg {

      fill: currentColor !important;

      width: 17px !important;
      height: 17px !important;

      opacity: .8;
    }


    /* =====================================================
       INPUTS / EDITOR
       ===================================================== */

    input,
    textarea,
    select {

      font-family: "Vazirmatn", sans-serif !important;

      border-radius: 5px !important;
    }


    textarea {

      line-height: 1.9 !important;

      direction: rtl !important;
      text-align: right !important;
    }


    input:focus,
    textarea:focus,
    select:focus {

      outline-color: var(--gl-red) !important;
    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    button {

      font-family: "Vazirmatn", sans-serif !important;

      border-radius: 5px !important;
    }


    /* =====================================================
       TYPOGRAPHY
       ===================================================== */

    h1,
    h2,
    h3,
    h4,
    h5 {

      font-family: "Vazirmatn", sans-serif !important;

      letter-spacing: 0 !important;
    }


    /* =====================================================
       SCROLLBAR
       ===================================================== */

    ::-webkit-scrollbar {

      width: 8px;
      height: 8px;
    }


    ::-webkit-scrollbar-track {

      background: var(--gl-soft);
    }


    ::-webkit-scrollbar-thumb {

      background: #AAA7A0;

      border-radius: 20px;
    }


    ::-webkit-scrollbar-thumb:hover {

      background: var(--gl-red);
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 800px) {

      aside.css-1ff92bv-SidebarContainer-card-card {

        min-width: unset !important;

        width: 100% !important;
      }

    }

  </style>

</head>


<body>

  <!-- Decap CMS -->

  <script
    src="https://cdn.jsdelivr.net/npm/decap-cms@3.17.0-beta.0/dist/decap-cms.js">
  </script>

</body>

</html>
