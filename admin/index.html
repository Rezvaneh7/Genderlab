<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <title>GenderLab | مدیریت محتوا</title>

  <!-- =====================================================
       FONT
  ====================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       DECAP CONFIG
       IMPORTANT — DO NOT REMOVE
  ====================================================== -->

  <link
    href="config.yml"
    type="text/yaml"
    rel="cms-config-url"
  >


  <style>

    /* =====================================================
       GENDERLAB — WORDPRESS-STYLE CMS
    ====================================================== */

    :root {

      --gl-sidebar: #102C3A;
      --gl-sidebar-light: #173B4A;

      --gl-red: #A34D45;
      --gl-red-dark: #8C403A;

      --gl-bg: #F5F4F0;
      --gl-paper: #FFFFFF;
      --gl-soft: #EEECE5;

      --gl-border: #D9D8D3;

      --gl-text: #172B36;
      --gl-muted: #6F7B81;

      --gl-green: #DDEFE6;
      --gl-green-text: #286B50;

      --gl-yellow: #FFF0CC;
      --gl-yellow-text: #956A16;

      --gl-blue: #E3F0FB;
      --gl-blue-text: #286C9D;

    }


    /* =====================================================
       RESET
    ====================================================== */

    html,
    body {
      margin: 0 !important;
      padding: 0 !important;

      min-height: 100% !important;

      background: var(--gl-bg) !important;

      color: var(--gl-text) !important;

      font-family: "Vazirmatn", sans-serif !important;
    }


    body *,
    button,
    input,
    textarea,
    select {
      font-family: "Vazirmatn", sans-serif !important;
      box-sizing: border-box;
    }


    a {
      text-decoration: none;
    }


    /* =====================================================
       TOP ACCENT
    ====================================================== */

    body::before {
      content: "";

      position: fixed;
      z-index: 999999;

      top: 0;
      right: 0;
      left: 0;

      height: 4px;

      background: var(--gl-red);
    }


    /* =====================================================
       MAIN DECAP PAGE
    ====================================================== */

    #nc-root {
      min-height: 100vh !important;

      background: var(--gl-bg) !important;
    }


    /*
      Main Decap application background
    */

    #nc-root > div {
      background: var(--gl-bg) !important;
    }


    /* =====================================================
       SIDEBAR
       WordPress-style full-height panel
    ====================================================== */

    aside.css-1ff92bv-SidebarContainer-card-card {
      position: relative !important;

      width: 270px !important;
      min-width: 270px !important;

      min-height: calc(100vh - 40px) !important;

      margin: 0 !important;
      padding: 0 !important;

      background: var(--gl-sidebar) !important;

      border: 0 !important;
      border-radius: 0 !important;

      box-shadow: none !important;

      overflow: hidden !important;
    }


    /* =====================================================
       SIDEBAR BRAND
    ====================================================== */

    .css-148ci7f-SidebarHeading-cardTopHeading {
      position: relative;

      margin: 0 !important;
      padding: 30px 25px 22px !important;

      background: var(--gl-sidebar) !important;

      color: rgba(255,255,255,.55) !important;

      border: 0 !important;
      border-bottom: 1px solid rgba(255,255,255,.09) !important;

      font-size: 0 !important;
    }


    .css-148ci7f-SidebarHeading-cardTopHeading::before {
      content: "GENDERLAB";

      display: block;

      direction: ltr;
      text-align: right;

      color: #FFFFFF;

      font-size: 23px;
      line-height: 1;
      font-weight: 700;

      letter-spacing: .06em;
    }


    .css-148ci7f-SidebarHeading-cardTopHeading::after {
      content: "جندرلب  ·  مدیریت محتوا";

      display: block;

      margin-top: 9px;

      direction: rtl;
      text-align: right;

      color: rgba(255,255,255,.58);

      font-size: 11px;
      font-weight: 400;

      letter-spacing: 0;
    }


    /* =====================================================
       SEARCH IN SIDEBAR
    ====================================================== */

    .css-lk98m2-SearchContainer {
      padding: 18px 15px 10px !important;

      background: var(--gl-sidebar) !important;

      border: 0 !important;
    }


    .css-1mpi08-InputContainer {
      height: 39px !important;

      background: rgba(255,255,255,.07) !important;

      border: 1px solid rgba(255,255,255,.13) !important;
      border-radius: 3px !important;

      box-shadow: none !important;
    }


    .css-1fhcqx0-SearchInput {
      background: transparent !important;

      border: 0 !important;

      color: #FFFFFF !important;

      direction: rtl !important;
      text-align: right !important;

      font-size: 11px !important;
    }


    .css-1fhcqx0-SearchInput::placeholder {
      color: rgba(255,255,255,.45) !important;
    }


    .css-1mpi08-InputContainer svg {
      fill: rgba(255,255,255,.55) !important;
    }


    /* =====================================================
       SIDEBAR NAVIGATION
    ====================================================== */

    .css-kxvohc-SidebarNavList {
      margin: 0 !important;

      padding: 12px 0 25px !important;

      background: var(--gl-sidebar) !important;

      list-style: none !important;
    }


    .css-kxvohc-SidebarNavList li {
      margin: 0 !important;
      padding: 0 !important;
    }


    /*
      Collection links
    */

    a[data-testid="issues"],
    a[data-testid="articles"] {
      position: relative;

      display: flex !important;
      align-items: center !important;

      width: 100% !important;

      gap: 12px !important;

      margin: 0 !important;
      padding: 14px 22px !important;

      background: transparent !important;

      color: rgba(255,255,255,.78) !important;

      border-radius: 0 !important;

      font-size: 13px !important;
      font-weight: 500 !important;

      transition:
        background .15s ease,
        color .15s ease !important;
    }


    a[data-testid="issues"]:hover,
    a[data-testid="articles"]:hover {
      background: rgba(255,255,255,.06) !important;

      color: #FFFFFF !important;
    }


    /*
      Active
    */

    a[data-testid="issues"].sidebar-active,
    a[data-testid="articles"].sidebar-active,
    a[data-testid="issues"][aria-current="page"],
    a[data-testid="articles"][aria-current="page"] {
      background: var(--gl-red) !important;

      color: #FFFFFF !important;

      font-weight: 600 !important;
    }


    /*
      WordPress-style active stripe
    */

    a[data-testid="issues"].sidebar-active::before,
    a[data-testid="articles"].sidebar-active::before,
    a[data-testid="issues"][aria-current="page"]::before,
    a[data-testid="articles"][aria-current="page"]::before {
      content: "";

      position: absolute;

      top: 0;
      right: 0;
      bottom: 0;

      width: 4px;

      background: #FFFFFF;
    }


    a[data-testid="issues"] svg,
    a[data-testid="articles"] svg {
      width: 18px !important;
      height: 18px !important;

      fill: currentColor !important;

      opacity: .8;
    }


    /* =====================================================
       WORKFLOW / DRAFT NAVIGATION

       Decap's real editorial workflow remains intact.
    ====================================================== */

    a[href*="/workflow"] {
      position: relative;

      color: rgba(255,255,255,.80) !important;
    }


    a[href*="/workflow"]:hover {
      color: #FFFFFF !important;
    }


    /*
      Give workflow/drafts a small red indicator
    */

    a[href*="/workflow"]::after {
      content: "پیش‌نویس‌ها";

      display: inline-block;

      margin-right: 8px;
      padding: 2px 7px;

      background: rgba(163,77,69,.28);

      color: #FFFFFF;

      border-radius: 20px;

      font-size: 8px;
      font-weight: 500;
    }


    /* =====================================================
       MAIN CONTENT AREA
    ====================================================== */

    main {
      background: var(--gl-bg) !important;
    }


    /*
      Generic Decap cards
    */

    [class*="Card"] {
      border-color: var(--gl-border) !important;

      box-shadow:
        0 1px 2px rgba(23,43,54,.035) !important;
    }


    /* =====================================================
       PAGE HEADINGS
    ====================================================== */

    h1 {
      color: var(--gl-text) !important;

      font-size: 29px !important;
      line-height: 1.4 !important;

      font-weight: 700 !important;

      letter-spacing: 0 !important;
    }


    h2 {
      color: var(--gl-text) !important;

      letter-spacing: 0 !important;
    }


    /* =====================================================
       COLLECTION / ENTRY LIST
       Flatten cards to WordPress-style rows
    ====================================================== */

    [class*="EntriesCollection"] {
      background: var(--gl-paper) !important;

      border: 1px solid var(--gl-border) !important;
      border-radius: 2px !important;

      box-shadow: none !important;
    }


    /*
      Entry cards
    */

    [class*="EntryCard"] {
      margin: 0 !important;

      background: #FFFFFF !important;

      border: 0 !important;
      border-bottom: 1px solid #E7E5E0 !important;
      border-radius: 0 !important;

      box-shadow: none !important;

      transition: background .12s ease !important;
    }


    [class*="EntryCard"]:hover {
      background: #FAF9F6 !important;
    }


    /*
      Entry titles
    */

    [class*="EntryCard"] h2,
    [class*="EntryCard"] h3,
    [class*="EntryCard"] strong {
      color: var(--gl-text) !important;

      font-weight: 600 !important;
    }


    /* =====================================================
       BUTTONS
    ====================================================== */

    button {
      min-height: 36px;

      border-radius: 3px !important;

      font-size: 12px !important;

      box-shadow: none !important;
    }


    /*
      Primary / publish / new-entry buttons
    */

    button[class*="Button"],
    a[class*="Button"] {
      border-radius: 3px !important;

      box-shadow: none !important;
    }


    /*
      Make red buttons feel like WordPress Add New
    */

    button[style*="background"],
    a[style*="background"] {
      transition:
        opacity .15s ease,
        transform .15s ease !important;
    }


    button:hover,
    a[class*="Button"]:hover {
      opacity: .92;
    }


    /* =====================================================
       FORM / EDITOR
    ====================================================== */

    input,
    textarea,
    select {
      color: var(--gl-text) !important;

      background: #FFFFFF;

      border-radius: 3px !important;
    }


    input,
    select {
      min-height: 38px;
    }


    textarea {
      min-height: 120px;

      direction: rtl !important;
      text-align: right !important;

      line-height: 2 !important;
    }


    input:focus,
    textarea:focus,
    select:focus {
      outline: none !important;

      border-color: var(--gl-red) !important;

      box-shadow:
        0 0 0 1px var(--gl-red) !important;
    }


    /* =====================================================
       EDITOR CARDS / PANELS
    ====================================================== */

    [class*="ControlPane"] {
      background: var(--gl-bg) !important;
    }


    [class*="ControlPane"] > div {
      border-radius: 2px !important;
    }


    /*
      Field labels
    */

    label {
      color: var(--gl-text) !important;

      font-size: 12px !important;
      font-weight: 600 !important;
    }


    /* =====================================================
       WORKFLOW
       Drafts remain visible in Decap editorial workflow
    ====================================================== */

    [class*="Workflow"] {
      font-family: "Vazirmatn", sans-serif !important;
    }


    /*
      Workflow cards
    */

    [class*="Workflow"] [class*="Card"] {
      background: #FFFFFF !important;

      border: 1px solid var(--gl-border) !important;
      border-radius: 3px !important;

      box-shadow: none !important;
    }


    /* =====================================================
       STATUS VISUAL LANGUAGE
    ====================================================== */

    /*
      These are deliberately broad because Decap generates
      hashed class names.
    */

    [class*="published"],
    [class*="Published"] {
      color: var(--gl-green-text) !important;
    }


    [class*="draft"],
    [class*="Draft"] {
      color: var(--gl-yellow-text) !important;
    }


    [class*="review"],
    [class*="Review"] {
      color: var(--gl-blue-text) !important;
    }


    /* =====================================================
       DROPDOWNS / MENUS
    ====================================================== */

    [role="menu"] {
      background: #FFFFFF !important;

      border: 1px solid var(--gl-border) !important;
      border-radius: 3px !important;

      box-shadow:
        0 8px 25px rgba(23,43,54,.12) !important;
    }


    [role="menuitem"] {
      font-size: 12px !important;
    }


    [role="menuitem"]:hover {
      background: #F4F3EF !important;
    }


    /* =====================================================
       MODALS
    ====================================================== */

    [role="dialog"] {
      border-radius: 4px !important;

      font-family: "Vazirmatn", sans-serif !important;
    }


    /* =====================================================
       CHECKBOXES
    ====================================================== */

    input[type="checkbox"] {
      accent-color: var(--gl-red);
    }


    /* =====================================================
       SCROLLBAR
    ====================================================== */

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }


    ::-webkit-scrollbar-track {
      background: #ECEAE5;
    }


    ::-webkit-scrollbar-thumb {
      background: #AAA7A0;

      border-radius: 10px;
    }


    ::-webkit-scrollbar-thumb:hover {
      background: var(--gl-red);
    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 800px) {

      aside.css-1ff92bv-SidebarContainer-card-card {
        width: 100% !important;
        min-width: 0 !important;

        min-height: auto !important;
      }


      .css-148ci7f-SidebarHeading-cardTopHeading {
        padding: 20px !important;
      }


      .css-148ci7f-SidebarHeading-cardTopHeading::before {
        font-size: 20px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       DECAP CMS

       IMPORTANT:
       This exact beta version is intentional.
       It is the version currently working with turbo-github.
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/decap-cms@3.17.0-beta.0/dist/decap-cms.js">
  </script>


</body>

</html>
