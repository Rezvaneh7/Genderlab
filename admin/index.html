       GENDERLAB ADMIN LOGIC
  ====================================================== -->

  <script>

    const GL_PREVIEW_STORAGE_KEY =
      "genderlab_live_preview";


    /* =====================================================
       ROUTE INFORMATION
    ====================================================== */

    function getGenderLabRoute() {

      const hash =
        window.location.hash || "#/";

      let type = null;

      if (hash.includes("/collections/articles")) {
        type = "article";
      }

      if (hash.includes("/collections/issues")) {
        type = "issue";
      }


      const editing =
        type !== null &&
        (
          hash.includes("/entries/") ||
          hash.includes("/new")
        );


      return {
        hash,
        type,
        editing
      };

    }



    /* =====================================================
       READ CURRENT DECAP FORM
    ====================================================== */

    function findFieldByLabel(labelText) {

      const labels =
        Array.from(
          document.querySelectorAll("label")
        );


      const label =
        labels.find(item =>
          item.textContent
            .trim()
            .includes(labelText)
        );


      if (!label) {
        return null;
      }


      const container =
        label.closest(
          '[class*="Control"], [class*="Field"], [class*="Widget"]'
        ) ||
        label.parentElement;


      if (!container) {
        return null;
      }


      return (
        container.querySelector(
          'input:not([type="hidden"]), textarea, select'
        ) ||
        null
      );

    }



    function getFieldValue(label) {

      const field =
        findFieldByLabel(label);

      if (!field) {
        return "";
      }


      if (field.type === "checkbox") {
        return field.checked;
      }


      return field.value || "";

    }



    /* =====================================================
       BODY CONTENT
    ====================================================== */

    function getEditorBody() {

      const bodyField =
        findFieldByLabel("متن مطلب") ||
        findFieldByLabel("درباره این شماره");


      if (bodyField) {
        return bodyField.value || "";
      }


      const contentEditable =
        document.querySelector(
          '[contenteditable="true"]'
        );


      if (contentEditable) {
        return contentEditable.innerHTML;
      }


      return "";

    }



    /* =====================================================
       IMAGE
    ====================================================== */

    function getCurrentImage() {

      const candidates =
        Array.from(
          document.querySelectorAll("img")
        );


      const image =
        candidates.find(img => {

          const src =
            img.getAttribute("src") || "";

          return (
            src.includes("/assets/uploads/") ||
            src.includes("blob:") ||
            src.startsWith("data:")
          );

        });


      return image
        ? image.src
        : "";

    }



    /* =====================================================
       COLLECT PREVIEW DATA
    ====================================================== */

    function collectGenderLabPreviewData() {

      const route =
        getGenderLabRoute();


      if (!route.editing || !route.type) {
        return null;
      }


      if (route.type === "article") {

        return {

          type: "article",

          title:
            getFieldValue("عنوان مطلب"),

          excerpt:
            getFieldValue("خلاصه"),

          author:
            getFieldValue("نویسنده"),

          issue:
            getFieldValue("شماره مجله"),

          category:
            getFieldValue("نوع مطلب"),

          date:
            getFieldValue("تاریخ انتشار"),

          body:
            getEditorBody(),

          image:
            getCurrentImage()

        };

      }


      return {

        type: "issue",

        title:
          getFieldValue("عنوان شماره"),

        number:
          getFieldValue("شماره مجله"),

        numberFa:
          getFieldValue("شماره فارسی"),

        season:
          getFieldValue("فصل / تاریخ فارسی"),

        seasonEn:
          getFieldValue("فصل / تاریخ انگلیسی"),

        description:
          getFieldValue("معرفی کوتاه"),

        body:
          getEditorBody(),

        cover:
          getCurrentImage()

      };

    }



    /* =====================================================
       OPEN FULL PAGE PREVIEW
    ====================================================== */

    function openGenderLabPreview() {

      const data =
        collectGenderLabPreviewData();


      if (!data) {

        alert(
          "برای پیش‌نمایش ابتدا یک مطلب یا شماره مجله را باز کنید."
        );

        return;
      }


      try {

        localStorage.setItem(
          GL_PREVIEW_STORAGE_KEY,
          JSON.stringify(data)
        );


        window.open(
          "preview.html",
          "_blank"
        );

      }

      catch (error) {

        console.error(error);

        alert(
          "امکان ساخت پیش‌نمایش وجود نداشت."
        );

      }

    }



    /* =====================================================
       PREVIEW BUTTON VISIBILITY
    ====================================================== */

    function updatePreviewButton() {

      const button =
        document.getElementById(
          "gl-site-preview-button"
        );


      if (!button) {
        return;
      }


      const route =
        getGenderLabRoute();


      button.classList.toggle(
        "visible",
        route.editing
      );

    }



    /* =====================================================
       SIDEBAR
    ====================================================== */

    function updateGenderLabSidebar() {

      const hash =
        window.location.hash || "#/";

      const items =
        document.querySelectorAll(
          "#genderlab-admin-sidebar [data-route]"
        );

      const groups =
        document.querySelectorAll(
          "#genderlab-admin-sidebar .gl-menu-group"
        );


      items.forEach(item => {
        item.classList.remove("active");
      });


      groups.forEach(group => {
        group.classList.remove("current");
      });



      if (hash.includes("/workflow")) {

        const item =
          document.querySelector(
            '[data-route="workflow"]'
          );

        if (item) {
          item.classList.add("active");
        }


        const group =
          document.querySelector(
            '[data-group="workflow"]'
          );

        if (group) {
          group.classList.add("current");
        }

        return;
      }



      if (hash.includes("/collections/articles")) {

        const item =
          document.querySelector(
            '[data-route="articles"]'
          );

        if (item) {
          item.classList.add("active");
        }


        const group =
          document.querySelector(
            '[data-group="articles"]'
          );

        if (group) {
          group.classList.add("current");
        }

        return;
      }



      if (hash.includes("/collections/issues")) {

        const item =
          document.querySelector(
            '[data-route="issues"]'
          );

        if (item) {
          item.classList.add("active");
        }


        const group =
          document.querySelector(
            '[data-group="issues"]'
          );

        if (group) {
          group.classList.add("current");
        }

        return;
      }



      const dashboard =
        document.querySelector(
          '[data-route="dashboard"]'
        );


      if (dashboard) {
        dashboard.classList.add("active");
      }

    }



    /* =====================================================
       MENU GROUPS
    ====================================================== */

    document
      .querySelectorAll(
        ".gl-menu-group > .gl-nav-item"
      )
      .forEach(item => {

        item.addEventListener(
          "click",
          function () {

            const group =
              this.closest(
                ".gl-menu-group"
              );


            if (!group) {
              return;
            }


            group.classList.add("open");

          }
        );

      });



    /* =====================================================
       PREVIEW BUTTON
    ====================================================== */

    document
      .getElementById(
        "gl-site-preview-button"
      )
      .addEventListener(
        "click",
        openGenderLabPreview
      );



    /* =====================================================
       ROUTE CHANGE
    ====================================================== */

    function updateGenderLabAdmin() {

      updateGenderLabSidebar();

      /*
       * Decap renders asynchronously,
       * so give the editor a moment to appear.
       */

      setTimeout(
        updatePreviewButton,
        350
      );

      setTimeout(
        updatePreviewButton,
        900
      );

    }


    window.addEventListener(
      "hashchange",
      updateGenderLabAdmin
    );


    window.addEventListener(
      "load",
      updateGenderLabAdmin
    );


    updateGenderLabAdmin();

  </script>


</body>
</html>
