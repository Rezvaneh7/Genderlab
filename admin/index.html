  <style>

    :root {
      --sidebar-width: 258px;

      --petroleum: #102C3A;
      --petroleum-deep: #0D2632;
      --petroleum-hover: #173946;

      --red: #A34D45;
      --red-hover: #93443E;

      --cream: #F6F5F1;
      --paper: #FFFFFF;

      --text: #172B36;
      --muted: #778188;

      --border: #DEDDD8;
    }


    /* =====================================================
       GLOBAL
    ====================================================== */

    html,
    body {
      margin: 0 !important;
      padding: 0 !important;

      min-height: 100% !important;

      background: var(--cream) !important;

      color: var(--text);

      font-family: "Vazirmatn", sans-serif !important;
    }


    body *,
    button,
    input,
    textarea,
    select {
      box-sizing: border-box;
      font-family: "Vazirmatn", sans-serif !important;
    }


    body {
      padding-right: var(--sidebar-width) !important;
    }


    a {
      text-decoration: none;
    }


    /* =====================================================
       CUSTOM SIDEBAR
    ====================================================== */

    #genderlab-admin-sidebar {
      position: fixed;

      z-index: 999999;

      top: 0;
      right: 0;
      bottom: 0;

      width: var(--sidebar-width);

      display: flex;
      flex-direction: column;

      background:
        linear-gradient(
          180deg,
          var(--petroleum-deep) 0%,
          var(--petroleum) 100%
        );

      color: #FFFFFF;

      direction: rtl;

      box-shadow: -1px 0 0 rgba(0,0,0,.05);
    }


    /* =====================================================
       BRAND
    ====================================================== */

    .gl-admin-brand {
      padding: 27px 24px 24px;

      border-bottom: 1px solid rgba(255,255,255,.10);
    }


    .gl-admin-brand-en {
      direction: ltr;
      text-align: right;

      color: #FFFFFF;

      font-size: 25px;
      line-height: 1;
      font-weight: 700;

      letter-spacing: .045em;
    }


    .gl-admin-brand-fa {
      margin-top: 9px;

      color: rgba(255,255,255,.90);

      font-size: 17px;
      font-weight: 600;
    }


    .gl-admin-brand-small {
      margin-top: 6px;

      color: rgba(255,255,255,.38);

      direction: ltr;
      text-align: right;

      font-size: 8px;
      font-weight: 500;

      letter-spacing: .16em;
    }


    /* =====================================================
       NAVIGATION
    ====================================================== */

    .gl-admin-nav {
      flex: 1;

      padding: 19px 0;

      overflow-y: auto;
    }


    .gl-nav-section {
      margin-bottom: 11px;
    }


    .gl-nav-label {
      padding: 11px 24px 7px;

      color: rgba(255,255,255,.34);

      font-size: 9px;
      font-weight: 500;

      letter-spacing: .05em;
    }


    .gl-nav-item {
      position: relative;

      min-height: 48px;

      display: flex;
      align-items: center;

      gap: 13px;

      padding: 0 22px;

      color: rgba(255,255,255,.78);

      font-size: 13px;
      font-weight: 500;

      cursor: pointer;

      transition:
        background .15s ease,
        color .15s ease;
    }


    .gl-nav-item:hover {
      background: var(--petroleum-hover);
      color: #FFFFFF;
    }


    .gl-nav-item.active {
      background: var(--red);
      color: #FFFFFF;

      font-weight: 600;
    }


    .gl-nav-item.active::before {
      content: "";

      position: absolute;

      top: 0;
      right: 0;
      bottom: 0;

      width: 4px;

      background: #F7F4EE;
    }


    /* =====================================================
       ICONS
    ====================================================== */

    .gl-icon {
      width: 21px;
      height: 21px;

      flex: 0 0 21px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: currentColor;

      opacity: .88;
    }


    .gl-icon svg {
      width: 20px;
      height: 20px;

      fill: none;

      stroke: currentColor;

      stroke-width: 1.8;

      stroke-linecap: round;
      stroke-linejoin: round;
    }


    /* =====================================================
       SUB MENU
    ====================================================== */

    .gl-submenu {
      display: none;

      padding: 5px 0 8px;

      background: rgba(0,0,0,.10);
    }


    .gl-menu-group.open .gl-submenu,
    .gl-menu-group.current .gl-submenu {
      display: block;
    }


    .gl-submenu a {
      display: block;

      padding: 8px 55px 8px 20px;

      color: rgba(255,255,255,.57);

      font-size: 11px;

      transition:
        color .15s ease,
        background .15s ease;
    }


    .gl-submenu a:hover {
      background: rgba(255,255,255,.035);
      color: #FFFFFF;
    }


    .gl-submenu a.current {
      color: #FFFFFF;
      font-weight: 600;
    }


    /* =====================================================
       DIVIDER
    ====================================================== */

    .gl-nav-divider {
      height: 1px;

      margin: 15px 20px;

      background: rgba(255,255,255,.10);
    }


    /* =====================================================
       SIDEBAR BOTTOM
    ====================================================== */

    .gl-admin-bottom {
      padding: 11px 0 16px;

      border-top: 1px solid rgba(255,255,255,.10);
    }


    .gl-admin-bottom .gl-nav-item {
      min-height: 43px;

      font-size: 11px;
    }


    /* =====================================================
       HIDE ORIGINAL DECAP SIDEBAR
    ====================================================== */

    aside.css-1ff92bv-SidebarContainer-card-card {
      display: none !important;
    }


    #nc-root aside[class*="SidebarContainer"] {
      display: none !important;
    }


    /* =====================================================
       DECAP MAIN AREA
    ====================================================== */

    #nc-root {
      min-height: 100vh !important;

      background: var(--cream) !important;
    }


    #nc-root > div {
      background: var(--cream) !important;
    }


    main {
      width: 100% !important;

      background: var(--cream) !important;
    }


    /* =====================================================
       TYPOGRAPHY
    ====================================================== */

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      color: var(--text) !important;

      font-family: "Vazirmatn", sans-serif !important;

      letter-spacing: 0 !important;
    }


    h1 {
      font-size: 28px !important;
      font-weight: 700 !important;
    }


    /* =====================================================
       DECAP CARDS
    ====================================================== */

    [class*="card"],
    [class*="Card"] {
      border-color: var(--border) !important;

      border-radius: 2px !important;

      box-shadow:
        0 1px 2px rgba(16,44,58,.04) !important;
    }


    /* =====================================================
       ENTRY LIST
    ====================================================== */

    [class*="EntryCard"] {
      margin: 0 !important;

      background: #FFFFFF !important;

      border: 0 !important;
      border-bottom: 1px solid #E7E6E1 !important;
      border-radius: 0 !important;

      box-shadow: none !important;
    }


    [class*="EntryCard"]:hover {
      background: #FAF9F6 !important;
    }


    /* =====================================================
       BUTTONS
    ====================================================== */

    button,
    a[class*="Button"] {
      border-radius: 3px !important;

      font-family: "Vazirmatn", sans-serif !important;

      box-shadow: none !important;
    }


    /* =====================================================
       INPUTS
    ====================================================== */

    input,
    textarea,
    select {
      border-radius: 3px !important;
    }


    textarea {
      direction: rtl !important;
      text-align: right !important;

      line-height: 2 !important;
    }


    input:focus,
    textarea:focus,
    select:focus {
      outline: none !important;

      border-color: var(--red) !important;

      box-shadow:
        0 0 0 1px var(--red) !important;
    }


    /* =====================================================
       MODALS / MENUS
    ====================================================== */

    [role="dialog"],
    [role="menu"] {
      border-radius: 3px !important;

      font-family: "Vazirmatn", sans-serif !important;
    }


    [role="menu"] {
      border: 1px solid var(--border) !important;

      box-shadow:
        0 8px 28px rgba(16,44,58,.12) !important;
    }


    /* =====================================================
       SCROLLBAR
    ====================================================== */

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }


    ::-webkit-scrollbar-track {
      background: #ECEAE5;
    }


    ::-webkit-scrollbar-thumb {
      background: #AAA7A0;

      border-radius: 10px;
    }


    ::-webkit-scrollbar-thumb:hover {
      background: var(--red);
    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 800px) {

      :root {
        --sidebar-width: 0px;
      }


      body {
        padding-right: 0 !important;
      }


      #genderlab-admin-sidebar {
        position: relative;

        width: 100%;
        height: auto;

        bottom: auto;
      }


      .gl-admin-brand {
        padding: 20px;
      }


      .gl-admin-nav {
        display: flex;

        padding: 0;

        overflow-x: auto;
      }


      .gl-nav-section {
        display: flex;

        margin: 0;
      }


      .gl-nav-label,
      .gl-submenu,
      .gl-nav-divider,
      .gl-admin-bottom {
        display: none !important;
      }


      .gl-nav-item {
        min-width: max-content;

        padding: 0 18px;
      }

    }

  </style>

</head>

  <!-- =====================================================
       GENDERLAB LIVE PREVIEW
  ====================================================== -->

  <script>

    /*
     * ARTICLE PREVIEW
     */

    const GenderLabArticlePreview = createClass({

      render: function () {

        const entry = this.props.entry;

        const title =
          entry.getIn(["data", "title"]) || "عنوان مطلب";

        const excerpt =
          entry.getIn(["data", "excerpt"]) || "";

        const author =
          entry.getIn(["data", "author"]) || "";

        const category =
          entry.getIn(["data", "category"]) || "";

        const issue =
          entry.getIn(["data", "issue"]) || "";

        const imageValue =
          entry.getIn(["data", "image"]);

        const image =
          imageValue
            ? this.props.getAsset(imageValue).toString()
            : null;


        return h(

          "div",

          {
            style: {
              direction: "rtl",
              background: "#F7F4EE",
              color: "#172B36",
              minHeight: "100vh",
              fontFamily: "Vazirmatn, sans-serif"
            }
          },


          /* HEADER */

          h(

            "header",

            {
              style: {
                padding: "22px 45px",
                borderBottom: "1px solid #D9D8D3",
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center"
              }
            },


            h(

              "div",

              {
                style: {
                  fontSize: "21px",
                  fontWeight: "700",
                  direction: "ltr",
                  letterSpacing: ".05em"
                }
              },

              "GENDERLAB"

            ),


            h(

              "div",

              {
                style: {
                  fontSize: "12px",
                  color: "#778188"
                }
              },

              "جندرلب"

            )

          ),



          /* ARTICLE */

          h(

            "main",

            {
              style: {
                maxWidth: "850px",
                margin: "0 auto",
                padding: "65px 45px 100px"
              }
            },


            /* META */

            h(

              "div",

              {
                style: {
                  color: "#A34D45",
                  fontSize: "12px",
                  fontWeight: "600",
                  marginBottom: "22px"
                }
              },

              category,

              category && issue
                ? "  /  "
                : "",

              issue
                ? "شماره " + issue
                : ""

            ),



            /* TITLE */

            h(

              "h1",

              {
                style: {
                  margin: "0 0 25px",
                  fontSize: "44px",
                  lineHeight: "1.45",
                  fontWeight: "700",
                  color: "#172B36"
                }
              },

              title

            ),



            /* EXCERPT */

            excerpt && h(

              "p",

              {
                style: {
                  margin: "0 0 24px",
                  maxWidth: "700px",
                  color: "#56666E",
                  fontSize: "18px",
                  lineHeight: "2"
                }
              },

              excerpt

            ),



            /* AUTHOR */

            author && h(

              "div",

              {
                style: {
                  paddingTop: "17px",
                  marginBottom: "40px",
                  borderTop: "1px solid #D9D8D3",
                  color: "#778188",
                  fontSize: "12px"
                }
              },

              "نویسنده: " + author

            ),



            /* IMAGE */

            image && h(

              "img",

              {
                src: image,

                style: {
                  display: "block",
                  width: "100%",
                  maxHeight: "520px",
                  objectFit: "cover",
                  marginBottom: "50px"
                }
              }

            ),



            /* BODY */

            h(

              "article",

              {
                style: {
                  maxWidth: "680px",
                  margin: "0 auto",
                  fontSize: "17px",
                  lineHeight: "2.25",
                  color: "#243740"
                }
              },

              this.props.widgetFor("body")

            )

          )

        );

      }

    });



    /*
     * ISSUE PREVIEW
     */

    const GenderLabIssuePreview = createClass({

      render: function () {

        const entry = this.props.entry;

        const title =
          entry.getIn(["data", "title"]) || "عنوان شماره";

        const number =
          entry.getIn(["data", "numberFa"]) ||
          entry.getIn(["data", "number"]) ||
          "";

        const season =
          entry.getIn(["data", "season"]) || "";

        const description =
          entry.getIn(["data", "description"]) || "";

        const coverValue =
          entry.getIn(["data", "cover"]);

        const cover =
          coverValue
            ? this.props.getAsset(coverValue).toString()
            : null;


        return h(

          "div",

          {
            style: {
              direction: "rtl",
              minHeight: "100vh",
              background: "#F7F4EE",
              color: "#172B36",
              fontFamily: "Vazirmatn, sans-serif"
            }
          },


          /* HEADER */

          h(

            "header",

            {
              style: {
                padding: "22px 45px",
                borderBottom: "1px solid #D9D8D3",
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center"
              }
            },


            h(

              "div",

              {
                style: {
                  direction: "ltr",
                  fontSize: "21px",
                  fontWeight: "700",
                  letterSpacing: ".05em"
                }
              },

              "GENDERLAB"

            ),


            h(

              "div",

              {
                style: {
                  color: "#778188",
                  fontSize: "12px"
                }
              },

              "جندرلب"

            )

          ),



          /* HERO */

          h(

            "main",

            {
              style: {
                maxWidth: "1050px",
                margin: "0 auto",
                padding: "65px 45px"
              }
            },


            h(

              "div",

              {
                style: {
                  display: "grid",
                  gridTemplateColumns: "minmax(240px, 380px) 1fr",
                  gap: "65px",
                  alignItems: "center"
                }
              },


              /* COVER */

              h(

                "div",

                null,

                cover

                  ? h(

                      "img",

                      {
                        src: cover,

                        style: {
                          display: "block",
                          width: "100%",
                          boxShadow:
                            "0 18px 45px rgba(16,44,58,.13)"
                        }
                      }

                    )

                  : h(

                      "div",

                      {
                        style: {
                          aspectRatio: "3 / 4",
                          background: "#102C3A",
                          color: "#FFFFFF",
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "center",
                          fontSize: "24px"
                        }
                      },

                      "GENDERLAB"

                    )

              ),



              /* TEXT */

              h(

                "div",

                null,


                h(

                  "div",

                  {
                    style: {
                      color: "#A34D45",
                      fontSize: "12px",
                      fontWeight: "600",
                      marginBottom: "18px"
                    }
                  },

                  number
                    ? "شماره " + number
                    : "شماره مجله"

                ),


                season && h(

                  "div",

                  {
                    style: {
                      color: "#778188",
                      fontSize: "11px",
                      marginBottom: "13px"
                    }
                  },

                  season

                ),


                h(

                  "h1",

                  {
                    style: {
                      margin: "0 0 25px",
                      color: "#172B36",
                      fontSize: "48px",
                      lineHeight: "1.4",

  </script>



  <!-- =====================================================
       SIDEBAR ROUTE STATE
  ====================================================== -->

  <script>

    function updateGenderLabSidebar() {

      const hash =
        window.location.hash || "#/";

      const items =
        document.querySelectorAll(
          "#genderlab-admin-sidebar [data-route]"
        );

      const groups =
        document.querySelectorAll(
          "#genderlab-admin-sidebar .gl-menu-group"
        );


      /* RESET */

      items.forEach(item => {
        item.classList.remove("active");
      });


      groups.forEach(group => {
        group.classList.remove("current");
      });



      /* WORKFLOW */

      if (hash.includes("/workflow")) {

        const item =
          document.querySelector(
            '[data-route="workflow"]'
          );

        if (item) {
          item.classList.add("active");
        }


        const group =
          document.querySelector(
            '[data-group="workflow"]'
          );

        if (group) {
          group.classList.add("current");
        }

        return;
      }



      /* ARTICLES */

      if (hash.includes("/collections/articles")) {

        const item =
          document.querySelector(
            '[data-route="articles"]'
          );

        if (item) {
          item.classList.add("active");
        }


        const group =
          document.querySelector(
            '[data-group="articles"]'
          );

        if (group) {
          group.classList.add("current");
        }

        return;
      }



      /* ISSUES */

      if (hash.includes("/collections/issues")) {

        const item =
          document.querySelector(
            '[data-route="issues"]'
          );

        if (item) {
          item.classList.add("active");
        }


        const group =
          document.querySelector(
            '[data-group="issues"]'
          );

        if (group) {
          group.classList.add("current");
        }

        return;
      }



      /* DASHBOARD */

      const dashboard =
        document.querySelector(
          '[data-route="dashboard"]'
        );

      if (dashboard) {
        dashboard.classList.add("active");
      }

    }



    /* =====================================================
       COLLAPSIBLE GROUPS
    ====================================================== */

    document
      .querySelectorAll(
        ".gl-menu-group > .gl-nav-item"
      )
      .forEach(item => {

        item.addEventListener(
          "click",
          function () {

            const group =
              this.closest(".gl-menu-group");

            if (!group) return;

            group.classList.add("open");

          }
        );

      });



    /* =====================================================
       RUN
    ====================================================== */

    window.addEventListener(
      "hashchange",
      updateGenderLabSidebar
    );


    window.addEventListener(
      "load",
      updateGenderLabSidebar
    );


    updateGenderLabSidebar();

  </script>
