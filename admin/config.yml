backend:
  name: turbo-github
  turbo_site_id: 20aff52d-5b0e-497c-bb0b-feef5e3194c7
  branch: main

media_folder: "assets/uploads"
public_folder: "/Genderlab/assets/uploads"

locale: "fa"

collections:

  # ==================================================
  # MAGAZINE ISSUES
  # ==================================================

  - name: "issues"
    label: "📚 شماره‌های مجله"
    label_singular: "شماره مجله"

    folder: "_issues"
    create: true

    slug: "{{fields.number}}"

    identifier_field: "title"

    summary: "شماره {{number}} — {{title}}"

    editor:
      preview: false

    fields:

      - label: "عنوان شماره"
        name: "title"
        widget: "string"
        hint: "عنوان اصلی این شماره از مجله"

      - label: "شماره مجله"
        name: "number"
        widget: "string"
        hint: "مثلاً 01"

      - label: "شماره فارسی"
        name: "numberFa"
        widget: "string"
        hint: "مثلاً ۰۱"

      - label: "تاریخ انتشار"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: "فصل / تاریخ فارسی"
        name: "season"
        widget: "string"
        hint: "مثلاً پاییز ۱۴۰۵"

      - label: "فصل / تاریخ انگلیسی"
        name: "seasonEn"
        widget: "string"
        hint: "مثلاً AUTUMN 2026"

      - label: "معرفی کوتاه"
        name: "description"
        widget: "text"
        hint: "متن کوتاهی که در صفحه اصلی و آرشیو شماره‌ها نمایش داده می‌شود."

      - label: "جلد شماره"
        name: "cover"
        widget: "image"
        hint: "تصویر اصلی جلد این شماره"

      - label: "نسخه PDF"
        name: "pdf"
        widget: "file"
        required: false
        hint: "در صورت وجود، فایل کامل PDF این شماره را بارگذاری کنید."

      - label: "درباره این شماره"
        name: "body"
        widget: "markdown"
        required: false
        hint: "متن معرفی کامل شماره که در صفحه اختصاصی آن نمایش داده می‌شود."


  # ==================================================
  # ARTICLES
  # ==================================================

  - name: "articles"
    label: "✍️ مطالب مجله"
    label_singular: "مطلب"

    folder: "_articles"
    create: true

    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    identifier_field: "title"

    summary: "{{title}} — {{author}}"

    editor:
      preview: false

    fields:

      # ----------------------------------------------
      # MAIN CONTENT
      # ----------------------------------------------

      - label: "عنوان مطلب"
        name: "title"
        widget: "string"
        hint: "عنوان اصلی مطلب"

      - label: "متن مطلب"
        name: "body"
        widget: "richtext"
        hint: "متن کامل مطلب را اینجا بنویسید."

      - label: "خلاصه"
        name: "excerpt"
        widget: "text"
        hint: "یک معرفی کوتاه برای نمایش در صفحه اصلی، صفحه شماره و فهرست مطالب."

      - label: "تصویر اصلی"
        name: "image"
        widget: "image"
        required: false
        hint: "تصویر شاخص مطلب برای نمایش در سایت."


      # ----------------------------------------------
      # PUBLICATION INFORMATION
      # ----------------------------------------------

      - label: "نویسنده"
        name: "author"
        widget: "string"
        hint: "نام نویسنده یا نویسندگان مطلب"

      - label: "شماره مجله"
        name: "issue"
        widget: "relation"

        collection: "issues"

        search_fields:
          - "title"
          - "number"

        value_field: "number"

        display_fields:
          - "number"
          - "title"

        hint: "این مطلب متعلق به کدام شماره مجله است؟"

      - label: "نوع مطلب"
        name: "category"
        widget: "select"

        options:
          - "مقاله"
          - "جستار"
          - "گفت‌وگو"
          - "گزارش"
          - "یادداشت"
          - "نقد"

        hint: "نوع محتوای منتشرشده را انتخاب کنید."

      - label: "تاریخ انتشار"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "تاریخی که مطلب در آن منتشر می‌شود."
