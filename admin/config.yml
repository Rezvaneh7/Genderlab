# =========================================================
#  GENDERLAB — «پرونده ویژه» additions for admin/config.yml
#  This is NOT a complete config. Merge the three parts below
#  into your existing admin/config.yml.
# =========================================================


# ---------------------------------------------------------
# 1) In the "articles" collection → under `fields:`
#    add these two fields (anywhere in the list; after
#    «تاریخ انتشار» is a good spot).
# ---------------------------------------------------------

      - label: "نمایش در پرونده ویژه"
        name: "featured"
        widget: "boolean"
        default: false
        required: false
        hint: "روشن کنید تا این نوشته بالای صفحهٔ اصلی، در پرونده ویژه، نمایش داده شود."

      - label: "ترتیب در پرونده"
        name: "featured_order"
        widget: "number"
        value_type: "int"
        min: 1
        required: false
        hint: "۱ = مطلب اصلی (بزرگ، بالای صفحه). عددهای بعدی زیر آن می‌آیند."


# ---------------------------------------------------------
# 2) In the "articles" collection itself (same level as
#    `name:`, `label:`, `fields:`), add a filter and sort
#    options — like WordPress's "Sticky" view.
# ---------------------------------------------------------

    view_filters:
      - label: "فقط پرونده ویژه"
        field: featured
        pattern: true

    sortable_fields: ["date", "title", "featured_order"]


# ---------------------------------------------------------
# 4) «مصاحبه‌ها» — its own collection (like a WordPress post
#    type). Add it to `collections:`, right after "articles".
#    Interviews are saved in the _interviews/ folder.
#    If your media settings differ, copy media_folder /
#    public_folder from your "articles" collection.
# ---------------------------------------------------------

  - name: "interviews"
    label: "مصاحبه‌ها"
    label_singular: "مصاحبه"
    folder: "_interviews"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - label: "عنوان مطلب"
        name: "title"
        widget: "string"

      - label: "گفت‌وگو با"
        name: "interviewee"
        widget: "string"
        hint: "نام و معرفی کوتاه مصاحبه‌شونده"

      - label: "مصاحبه‌کننده"
        name: "author"
        widget: "string"
        required: false

      - label: "خلاصه"
        name: "excerpt"
        widget: "text"
        required: false

      - label: "تاریخ انتشار"
        name: "date"
        widget: "datetime"

      - label: "تصویر"
        name: "image"
        widget: "image"
        required: false

      - label: "نوع مطلب"
        name: "type"
        widget: "hidden"
        default: "مصاحبه"

      - label: "متن مطلب"
        name: "body"
        widget: "markdown"


# ---------------------------------------------------------
# 3) A new collection at the END of `collections:`.
#    This is the «پرونده ویژه» settings page in the sidebar.
#    It writes to _data/featured.yml.
# ---------------------------------------------------------

  - name: "settings"
    label: "تنظیمات"
    editor:
      preview: false
    files:
      - name: "featured"
        label: "پرونده ویژه صفحهٔ اصلی"
        file: "_data/featured.yml"
        fields:
          - label: "پرونده ویژه روشن باشد"
            name: "enabled"
            widget: "boolean"
            default: true
            hint: "اگر خاموش باشد، بالای صفحهٔ اصلی تازه‌ترین نوشته‌ها نمایش داده می‌شوند."

          - label: "عنوان پرونده"
            name: "title"
            widget: "string"

          - label: "زیرعنوان"
            name: "subtitle"
            widget: "string"
            required: false

          - label: "معرفی کوتاه"
            name: "description"
            widget: "text"
            required: false

          - label: "تصویر پرونده"
            name: "image"
            widget: "image"
            required: false
            hint: "اندازهٔ پیشنهادی: ۱۶۰۰ × ۱۰۰۰"

          - label: "توضیح تصویر"
            name: "image_caption"
            widget: "string"
            required: false

          - label: "منبع تصویر"
            name: "image_credit"
            widget: "string"
            required: false
