backend:
  name: turbo-github
  turbo_site_id: 20aff52d-5b0e-497c-bb0b-feef5e3194c7
  branch: main

media_folder: "assets/uploads"
public_folder: "/Genderlab/assets/uploads"

locale: "en"

publish_mode: editorial_workflow

collections:

  - name: "issues"
    label: "شماره‌های مجله"
    label_singular: "شماره مجله"
    folder: "_issues"
    create: true
    slug: "{{fields.number}}"
    identifier_field: "title"
    summary: "شماره {{number}} — {{title}}"

    editor:
      preview: false

    fields:
      - label: "عنوان شماره"
        name: "title"
        widget: "string"
        hint: "عنوان اصلی این شماره از مجله"

      - label: "شماره مجله"
        name: "number"
        widget: "string"
        hint: "مثلاً 01"

      - label: "شماره فارسی"
        name: "numberFa"
        widget: "string"
        hint: "مثلاً ۰۱"

      - label: "تاریخ انتشار"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: "فصل / تاریخ فارسی"
        name: "season"
        widget: "string"
        hint: "مثلاً پاییز ۱۴۰۵"

      - label: "فصل / تاریخ انگلیسی"
        name: "seasonEn"
        widget: "string"
        hint: "مثلاً AUTUMN 2026"

      - label: "معرفی کوتاه"
        name: "description"
        widget: "text"
        hint: "معرفی کوتاه شماره برای صفحه اصلی و آرشیو."

      - label: "جلد شماره"
        name: "cover"
        widget: "image"
        hint: "تصویر اصلی جلد این شماره"

      - label: "نسخه PDF"
        name: "pdf"
        widget: "file"
        required: false
        hint: "فایل کامل PDF شماره، در صورت وجود."

      - label: "درباره این شماره"
        name: "body"
        widget: "richtext"
        required: false
        hint: "معرفی کامل این شماره."


  - name: "articles"
    label: "مطالب مجله"
    label_singular: "مطلب"
    folder: "_articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{author}}"

    editor:
      preview: false

    fields:
      - label: "عنوان مطلب"
        name: "title"
        widget: "string"
        hint: "عنوان اصلی مطلب"

      - label: "متن مطلب"
        name: "body"
        widget: "richtext"
        hint: "متن کامل مقاله را اینجا بنویسید."

      - label: "خلاصه"
        name: "excerpt"
        widget: "text"
        hint: "معرفی کوتاه مطلب برای صفحه اصلی و فهرست مطالب."

      - label: "تصویر اصلی"
        name: "image"
        widget: "image"
        required: false
        hint: "تصویر شاخص مطلب"

      - label: "نویسنده"
        name: "author"
        widget: "string"
        hint: "نام نویسنده یا نویسندگان"

      - label: "شماره مجله"
        name: "issue"
        widget: "relation"
        collection: "issues"
        search_fields:
          - "title"
          - "number"
        value_field: "number"
        display_fields:
          - "number"
          - "title"
        hint: "شماره‌ای که این مطلب در آن منتشر شده است."

      - label: "نوع مطلب"
        name: "category"
        widget: "select"
        options:
          - "مقاله"
          - "جستار"
          - "گفت‌وگو"
          - "گزارش"
          - "یادداشت"
          - "نقد"
        hint: "نوع محتوای مطلب"

      - label: "نمایش در کاروسل صفحه اصلی"
        name: "featured"
        widget: "boolean"
        default: false
        required: false
        hint: "برای نمایش این مطلب در کاروسل منتخب صفحه اصلی فعال کنید."

      - label: "تاریخ انتشار"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "تاریخ انتشار مطلب"
